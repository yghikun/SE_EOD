[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmpca"
version = "0.1.0"
description = "Failure-aware Metadata Protocol Conformance Analyzer"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fmpca = "src.fmpca.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

